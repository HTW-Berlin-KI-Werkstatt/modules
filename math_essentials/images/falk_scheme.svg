<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Falk scheme: each entry of AB sits where a row of A meets a column of B" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="760" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Falk's scheme: each entry of AB sits where A's row meets B's column</text>
<rect x="312" y="80" width="44" height="132" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
<rect x="268" y="80" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="290.0" y="106" text-anchor="middle" fill="#1f2328">2</text><rect x="312" y="80" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="334.0" y="106" text-anchor="middle" fill="#1f2328" font-weight="600">1</text><rect x="268" y="124" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="290.0" y="150" text-anchor="middle" fill="#1f2328">0</text><rect x="312" y="124" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="334.0" y="150" text-anchor="middle" fill="#1f2328" font-weight="600">3</text><rect x="268" y="168" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="290.0" y="194" text-anchor="middle" fill="#1f2328">1</text><rect x="312" y="168" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="334.0" y="194" text-anchor="middle" fill="#1f2328" font-weight="600">4</text><rect x="268" y="80" width="88" height="132" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="372" y="150" fill="#59636e">B (3×2)</text>
<rect x="120" y="228" width="132" height="44" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
<rect x="120" y="228" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="142.0" y="254" text-anchor="middle" fill="#1f2328" font-weight="600">1</text><rect x="164" y="228" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="186.0" y="254" text-anchor="middle" fill="#1f2328" font-weight="600">2</text><rect x="208" y="228" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="230.0" y="254" text-anchor="middle" fill="#1f2328" font-weight="600">0</text><rect x="120" y="272" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="142.0" y="298" text-anchor="middle" fill="#1f2328">3</text><rect x="164" y="272" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="186.0" y="298" text-anchor="middle" fill="#1f2328">1</text><rect x="208" y="272" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="230.0" y="298" text-anchor="middle" fill="#1f2328">2</text><rect x="120" y="228" width="132" height="88" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="108" y="276" text-anchor="end" fill="#59636e">A (2×3)</text>
<rect x="312" y="228" width="44" height="44" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
<rect x="268" y="228" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="290.0" y="254" text-anchor="middle" fill="#1f2328">2</text><rect x="312" y="228" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="334.0" y="254" text-anchor="middle" fill="#1f2328" font-weight="600">7</text><rect x="268" y="272" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="290.0" y="298" text-anchor="middle" fill="#1f2328">8</text><rect x="312" y="272" width="44" height="44" fill="none" stroke="#e5e7eb"/><text x="334.0" y="298" text-anchor="middle" fill="#1f2328">14</text><rect x="268" y="228" width="88" height="88" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="372" y="276" fill="#59636e">C = AB (2×2)</text>
<line x1="470" y1="232" x2="470" y2="312" stroke="#2563eb" stroke-width="2"/><text x="484" y="248" fill="#1f2328">c₁₂ = row 1 of A · column 2 of B</text><text x="484" y="272" font-weight="600" fill="#1f2328">= 1·1 + 2·3 + 0·4 = 7</text><text x="484" y="296" font-size="11.5" fill="#59636e">A's 3 columns line up with B's 3 rows</text>
</svg>